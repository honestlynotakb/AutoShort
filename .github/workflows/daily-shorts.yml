name: Autonomous Daily YouTube Shorts

on:
  schedule:
    # 8:00 AM Pakistan Time (PKT, UTC+5) is 03:00 UTC
    - cron: '0 3 * * *'
    # 8:10 PM Pakistan Time (PKT, UTC+5) is 15:10 UTC
    - cron: '10 15 * * *'
  # Allows triggering the workflow manually from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  make-and-publish-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Cache AI Models (Kokoro & Whisper)
        id: cache-models
        uses: actions/cache@v4
        with:
          path: |
            ~/.faceless-shorts
            ~/.cache/huggingface
          key: ai-models-v1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cloud/requirements.txt

      - name: Download Kokoro & Whisper Models (if not cached)
        run: |
          python faceless-shorts/scripts/voice.py --download
          python -c "from faster_whisper import WhisperModel; WhisperModel('small.en', device='cpu', compute_type='int8')"

      - name: Run Autonomous Short Generator & Publisher
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHROME: /usr/bin/google-chrome
          SOFTWARE_GL: "1"
        run: |
          python cloud/cloud_runner.py

      - name: Upload Video Artifact (Backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-shorts
          path: projects/**/renders/*.mp4
          retention-days: 30

      - name: Commit & Push Published Log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main || true
          git add _published.md
          if git diff --staged --quiet; then
            echo "No new publications to commit."
          else
            git commit -m "chore: record published short [skip ci]"
            git push
          fi
