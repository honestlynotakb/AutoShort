name: Autonomous Daily YouTube Shorts

run-name: ${{ inputs.slot != '' && inputs.slot != 'auto' && format('Short: {0}', inputs.slot) || format('Autonomous Short ({0})', github.event_name) }}

on:
  schedule:
    # 5 Daily Runs in Pakistan Time (PKT, UTC+5):
    # Slot 1: 08:00 AM PKT (03:00 UTC) - Geography & Flag Knowledge
    - cron: '0 3 * * *'
    # Slot 2: 12:00 PM PKT (07:00 UTC) - Space & Cosmic What-Ifs
    - cron: '0 7 * * *'
    # Slot 3: 04:00 PM PKT (11:00 UTC) - Survival & Extreme Scenarios
    - cron: '0 11 * * *'
    # Slot 4: 07:30 PM PKT (14:30 UTC) - Mind-Blowing Science & Physics
    - cron: '30 14 * * *'
    # Slot 5: 10:00 PM PKT (17:00 UTC) - Historic Torture Techniques & Bizarre History
    - cron: '0 17 * * *'

  # Allows triggering manually anytime from GitHub Actions tab
  workflow_dispatch:
    inputs:
      slot:
        description: 'Select Slot / Genre to Run'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - '1 - Geography & Flags (8:00 AM)'
          - '2 - Space & Cosmic (12:00 PM)'
          - '3 - Survival Scenarios (4:00 PM)'
          - '4 - Mind-Blowing Science (7:30 PM)'
          - '5 - Historic Torture (10:00 PM)'

  # Run diagnostic audit suite on code changes to prevent pipeline regressions
  push:
    branches: [ main ]
    paths:
      - 'cloud/**'
      - 'config/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  # Job 1: Fast diagnostic verification (<15s)
  test-pipeline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cloud/requirements.txt

      - name: Run Pipeline Audit Test Suite
        run: |
          python -m unittest tests/test_audit_suite.py -v

  # Job 2: Full video generation & publication (Only on schedule or manual dispatch)
  make-and-publish-short:
    needs: test-pipeline-audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Verify Headless Chrome Presence
        run: |
          which google-chrome || which google-chrome-stable || which chromium || echo "Checking Chrome binary paths..."
          google-chrome --version || google-chrome-stable --version || true

      - name: Cache AI Models (Kokoro & Whisper)
        id: cache-models
        uses: actions/cache@v4
        with:
          path: |
            ~/.faceless-shorts
            ~/.cache/huggingface
          key: ai-models-v1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cloud/requirements.txt

      - name: Download Kokoro & Whisper Models (if not cached)
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          python faceless-shorts/scripts/voice.py --download
          python -c "from faster_whisper import WhisperModel; WhisperModel('small.en', device='cpu', compute_type='int8')"

      - name: Run Autonomous Short Generator & Publisher
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHROME: /usr/bin/google-chrome
          SOFTWARE_GL: "1"
        run: |
          python cloud/cloud_runner.py --slot "${{ inputs.slot || 'auto' }}"

      - name: Upload Video Artifact (Backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-shorts-${{ inputs.slot || 'auto' }}-${{ github.run_id }}
          path: projects/**/renders/*.mp4
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit & Push Published Log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _published.md
          if git diff --staged --quiet; then
            echo "No new publications to commit."
          else
            git commit -m "chore: record published short [skip ci]"
            for attempt in 1 2 3; do
              echo "Push attempt $attempt..."
              git fetch origin main
              git rebase origin/main || git rebase --abort
              if git push origin main; then
                echo "Successfully pushed published short log to main."
                break
              fi
              echo "Push failed, retrying in 5 seconds..."
              sleep 5
            done
          fi
